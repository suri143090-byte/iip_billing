services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: iip-billing-frontend
    ports:
      - "127.0.0.1:3010:3000"
    depends_on:
      - backend
    networks:
      - iip-billing-network
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: iip-billing-backend
    ports:
      - "127.0.0.1:8010:8000"
    env_file:
      - ./backend/.env
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - iip-billing-network
    restart: unless-stopped

  mongo:
    image: mongo:6.0
    container_name: iip-billing-mongo
    volumes:
      - mongo_data:/data/db
    networks:
      - iip-billing-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  mongo_data:

networks:
  iip-billing-network:
    driver: bridge
